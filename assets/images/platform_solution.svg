<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340">
  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e0f2"/>
    </linearGradient>
  </defs>

  <!-- floating card / coin -->
  <g transform="translate(70 60)">
    <rect x="0" y="0" width="120" height="78" rx="12" fill="#3f63c8"/>
    <g transform="translate(34 39)">
      <circle r="20" fill="none" stroke="#9fb6ef" stroke-width="8"/>
      <circle r="20" fill="none" stroke="#46d6ec" stroke-width="8" stroke-dasharray="70 56" transform="rotate(-90)"/>
    </g>
    <rect x="66" y="26" width="42" height="6" rx="3" fill="#9fb6ef"/>
    <rect x="66" y="42" width="32" height="6" rx="3" fill="#9fb6ef"/>
  </g>

  <!-- skyscraper -->
  <g>
    <rect x="250" y="92" width="96" height="232" rx="4" fill="url(#tower)"/>
    <rect x="250" y="92" width="48" height="232" rx="4" fill="#eef3fc"/>
    <!-- window grid -->
    <g fill="#9bb4e6" opacity="0.85">
      <g>
        <rect x="262" y="110" width="14" height="16"/><rect x="284" y="110" width="14" height="16"/><rect x="306" y="110" width="14" height="16"/><rect x="328" y="110" width="10" height="16"/>
        <rect x="262" y="136" width="14" height="16"/><rect x="284" y="136" width="14" height="16"/><rect x="306" y="136" width="14" height="16"/><rect x="328" y="136" width="10" height="16"/>
        <rect x="262" y="162" width="14" height="16"/><rect x="284" y="162" width="14" height="16"/><rect x="306" y="162" width="14" height="16"/><rect x="328" y="162" width="10" height="16"/>
        <rect x="262" y="188" width="14" height="16"/><rect x="284" y="188" width="14" height="16"/><rect x="306" y="188" width="14" height="16"/><rect x="328" y="188" width="10" height="16"/>
        <rect x="262" y="214" width="14" height="16"/><rect x="284" y="214" width="14" height="16"/><rect x="306" y="214" width="14" height="16"/><rect x="328" y="214" width="10" height="16"/>
        <rect x="262" y="240" width="14" height="16"/><rect x="284" y="240" width="14" height="16"/><rect x="306" y="240" width="14" height="16"/><rect x="328" y="240" width="10" height="16"/>
        <rect x="262" y="266" width="14" height="16"/><rect x="284" y="266" width="14" height="16"/><rect x="306" y="266" width="14" height="16"/><rect x="328" y="266" width="10" height="16"/>
      </g>
    </g>
  </g>

  <!-- truck -->
  <g transform="translate(60 224)">
    <!-- container -->
    <rect x="0" y="0" width="120" height="62" rx="4" fill="#ef8a3c"/>
    <rect x="0" y="0" width="120" height="62" rx="4" fill="none" stroke="#d6772c" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="62" stroke="#d6772c" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="62" stroke="#d6772c" stroke-width="2"/>
    <!-- cab -->
    <path d="M120 16 L150 16 L168 40 L168 62 L120 62 Z" fill="#3f63c8"/>
    <rect x="126" y="24" width="26" height="18" rx="3" fill="#cfe0ff"/>
    <!-- wheels -->
    <circle cx="36" cy="68" r="13" fill="#0c1334" stroke="#3aa6cc" stroke-width="2.5"/>
    <circle cx="140" cy="68" r="13" fill="#0c1334" stroke="#3aa6cc" stroke-width="2.5"/>
  </g>
</svg>
