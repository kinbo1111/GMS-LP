<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
  <defs>
    <linearGradient id="aiBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#3f63c8"/>
    </linearGradient>
  </defs>

  <!-- back card with AI label -->
  <g transform="rotate(-4 300 120)">
    <rect x="210" y="58" width="180" height="120" rx="12" fill="url(#aiBack)"/>
    <text x="300" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" opacity="0.95">AI</text>
    <g stroke="#ffffff" stroke-width="2" opacity="0.8">
      <line x1="244" y1="120" x2="244" y2="150"/>
      <line x1="252" y1="124" x2="252" y2="146"/>
      <line x1="338" y1="118" x2="338" y2="152"/>
      <line x1="346" y1="124" x2="346" y2="146"/>
      <line x1="354" y1="120" x2="354" y2="150"/>
    </g>
  </g>

  <!-- front dashboard card -->
  <g>
    <rect x="40" y="92" width="210" height="150" rx="14" fill="#ffffff"/>
    <rect x="40" y="92" width="210" height="150" rx="14" fill="none" stroke="#dbe3f3" stroke-width="1"/>
    <!-- donut chart -->
    <g transform="translate(96 167)">
      <circle r="34" fill="none" stroke="#e4ebf8" stroke-width="12"/>
      <circle r="34" fill="none" stroke="#3f7ad6" stroke-width="12"
              stroke-dasharray="150 64" stroke-dashoffset="0" transform="rotate(-90)"/>
      <circle r="34" fill="none" stroke="#46d6ec" stroke-width="12"
              stroke-dasharray="48 166" stroke-dashoffset="-150" transform="rotate(-90)"/>
    </g>
    <!-- list lines -->
    <g>
      <circle cx="158" cy="124" r="5" fill="#3f7ad6"/>
      <rect x="170" y="121" width="62" height="6" rx="3" fill="#cfd9ee"/>
      <circle cx="158" cy="146" r="5" fill="#46d6ec"/>
      <rect x="170" y="143" width="48" height="6" rx="3" fill="#cfd9ee"/>
      <circle cx="158" cy="168" r="5" fill="#9b6bff"/>
      <rect x="170" y="165" width="56" height="6" rx="3" fill="#cfd9ee"/>
      <rect x="150" y="196" width="84" height="6" rx="3" fill="#e4ebf8"/>
      <rect x="150" y="210" width="64" height="6" rx="3" fill="#e4ebf8"/>
    </g>
  </g>
</svg>
